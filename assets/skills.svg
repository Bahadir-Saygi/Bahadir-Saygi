<svg xmlns="http://www.w3.org/2000/svg" width="700" height="490" viewBox="0 0 700 490">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, Arial, sans-serif; }
    .t { fill: #e2e8f0; font-size: 15px; font-weight: 600; }
    .p { fill: #22d3ee; font-size: 14px; font-weight: 700; }
    .h { fill: #ffffff; font-size: 22px; font-weight: 800; }
  </style>
  <rect width="700" height="490" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="350" y="40" text-anchor="middle" class="h">⚡ Yetenek Seviyelerim</text>

  <!-- 1 Lua -->
  <text x="30" y="86" class="t">Lua / FiveM Scripting</text>
  <rect x="230" y="72" width="390" height="16" rx="8" fill="#1f2937"/>
  <rect x="230" y="72" width="0" height="16" rx="8" fill="url(#g)" filter="url(#glow)"><animate attributeName="width" values="0;370;370" keyTimes="0;0.25;1" dur="8s" begin="0s" repeatCount="indefinite"/></rect>
  <text x="635" y="86" class="p">95%</text>

  <!-- 2 Discord.js -->
  <text x="30" y="120" class="t">Discord.js / Bot Dev</text>
  <rect x="230" y="106" width="390" height="16" rx="8" fill="#1f2937"/>
  <rect x="230" y="106" width="0" height="16" rx="8" fill="url(#g)" filter="url(#glow)"><animate attributeName="width" values="0;359;359" keyTimes="0;0.25;1" dur="8s" begin="0.15s" repeatCount="indefinite"/></rect>
  <text x="635" y="120" class="p">92%</text>

  <!-- 3 JS/TS -->
  <text x="30" y="154" class="t">JavaScript / TypeScript</text>
  <rect x="230" y="140" width="390" height="16" rx="8" fill="#1f2937"/>
  <rect x="230" y="140" width="0" height="16" rx="8" fill="url(#g)" filter="url(#glow)"><animate attributeName="width" values="0;351;351" keyTimes="0;0.25;1" dur="8s" begin="0.3s" repeatCount="indefinite"/></rect>
  <text x="635" y="154" class="p">90%</text>

